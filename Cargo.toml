[package]
name = "cmd-infer"
version = "0.2.0"
edition = "2024"
description = "AI-powered shell command fixer using the Anthropic Messages API"
license = "MIT"
repository = "https://github.com/DawsonJia/command-inference"
readme = "README.md"
keywords = ["cli", "ai", "shell", "command", "claude"]
categories = ["command-line-utilities"]

[[bin]]
name = "cmdi"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
